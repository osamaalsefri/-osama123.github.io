<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SPO">
<title>SPO Personal</title>
<style>
:root{--p:#155e75;--p2:#0e7490;--bg:#f4f7f9;--card:#fff;--txt:#17313a;--muted:#6b7d85;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:14px 18px;border-bottom:1px solid #dfe7ea;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.badge{font-size:12px;background:#dff3f7;color:var(--p);padding:5px 8px;border-radius:999px}main{padding:18px;max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(21,94,117,.18)}.hero h1{margin:0 0 8px;font-size:24px}.hero p{margin:0;opacity:.9;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{border:0;background:var(--card);border-radius:18px;padding:18px;text-align:right;box-shadow:0 4px 18px rgba(28,63,74,.08);cursor:pointer}.card .icon{font-size:30px}.card h3{margin:10px 0 4px}.count{color:var(--muted);font-size:14px}.section{display:none}.section.active{display:block}.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input{flex:1;border:1px solid #cfdadd;border-radius:14px;padding:13px;font-size:16px;background:#fff}button.primary{border:0;background:var(--p);color:#fff;border-radius:14px;padding:12px 15px;font-weight:700;font-size:15px}button.back{border:0;background:#e6eef1;color:var(--txt);border-radius:12px;padding:10px 13px;font-weight:700}.list{display:grid;gap:10px}.item{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 14px rgba(28,63,74,.07);display:flex;gap:12px;align-items:flex-start}.item-main{flex:1}.item h4{margin:0 0 7px}.item p{margin:0;color:var(--muted);white-space:pre-wrap;line-height:1.6}.item small{display:block;color:#93a1a7;margin-top:9px}.delete{border:0;background:#fee2e2;color:var(--danger);border-radius:10px;padding:8px}.empty{text-align:center;color:var(--muted);padding:42px 10px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;padding:20px;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 14px 14px;padding:20px}.sheet h2{margin-top:0}.sheet input,.sheet textarea{width:100%;border:1px solid #cfdadd;border-radius:14px;padding:13px;font-size:16px;margin:7px 0}.sheet textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.secondary{border:0;background:#e9eff2;border-radius:14px;padding:12px;font-weight:700}.note{margin-top:18px;background:#fff8db;border-radius:15px;padding:14px;line-height:1.7;font-size:14px}@media(max-width:390px){.grid{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style></head><body>
<header><div class="brand">SPO Personal</div><div class="badge">نسخة شخصية</div></header><main>
<section id="home" class="section active"><div class="hero"><h1>مكتبك البروتوكولي الشخصي</h1><p>نظّم الشخصيات المهمة والزيارات والمهام والملاحظات من مكان واحد.</p></div><div class="grid" id="cards"></div><div class="note">🔒 تُحفظ البيانات على هذا الجهاز داخل المتصفح. لا تمسح بيانات Safari إذا أردت الاحتفاظ بها.</div></section>
<section id="records" class="section"><button class="back" onclick="goHome()">رجوع</button><h2 id="sectionTitle"></h2><div class="toolbar"><input id="search" placeholder="بحث..." oninput="renderList()"><button class="primary" onclick="openModal()">إضافة</button></div><div id="list" class="list"></div></section></main>
<div id="modal" class="modal" onclick="outsideClose(event)"><div class="sheet"><h2 id="modalTitle">إضافة</h2><input id="titleInput" placeholder="العنوان أو الاسم"><textarea id="detailsInput" placeholder="التفاصيل"></textarea><div class="actions"><button class="secondary" onclick="closeModal()">إلغاء</button><button class="primary" onclick="saveRecord()">حفظ</button></div></div></div>
<script>
const types={vip:{title:"الشخصيات المهمة",singular:"شخصية مهمة",icon:"👤"},visits:{title:"الزيارات",singular:"زيارة",icon:"📅"},tasks:{title:"المهام",singular:"مهمة",icon:"✅"},notes:{title:"الملاحظات",singular:"ملاحظة",icon:"📝"}};let current="vip";function key(t){return"spo_personal_"+t}function load(t){try{return JSON.parse(localStorage.getItem(key(t))||"[]")}catch{return[]}}function save(t,d){localStorage.setItem(key(t),JSON.stringify(d))}function renderCards(){const c=document.getElementById("cards");c.innerHTML="";Object.entries(types).forEach(([id,x])=>{const n=load(id).length;c.insertAdjacentHTML("beforeend",`<button class="card" onclick="openSection('${id}')"><div class="icon">${x.icon}</div><h3>${x.title}</h3><div class="count">${n} سجل</div></button>`)})}function openSection(t){current=t;home.classList.remove("active");records.classList.add("active");sectionTitle.textContent=types[t].title;search.value="";renderList()}function goHome(){records.classList.remove("active");home.classList.add("active");renderCards()}function renderList(){const q=search.value.trim().toLowerCase();const data=load(current).filter(r=>(r.title+" "+r.details).toLowerCase().includes(q));if(!data.length){list.innerHTML='<div class="empty">لا توجد سجلات بعد</div>';return}list.innerHTML=data.map(r=>`<div class="item"><div class="item-main"><h4>${esc(r.title)}</h4><p>${esc(r.details||"")}</p><small>${new Date(r.createdAt).toLocaleString("ar-SA")}</small></div><button class="delete" onclick="del('${r.id}')">حذف</button></div>`).join("")}function openModal(){modalTitle.textContent="إضافة "+types[current].singular;titleInput.value="";detailsInput.value="";modal.classList.add("show");setTimeout(()=>titleInput.focus(),100)}function closeModal(){modal.classList.remove("show")}function outsideClose(e){if(e.target.id==="modal")closeModal()}function saveRecord(){const title=titleInput.value.trim();if(!title){alert("اكتب العنوان أو الاسم");return}const data=load(current);data.unshift({id:String(Date.now()),title,details:detailsInput.value.trim(),createdAt:new Date().toISOString()});save(current,data);closeModal();renderList()}function del(id){if(!confirm("حذف هذا السجل؟"))return;save(current,load(current).filter(r=>r.id!==id));renderList()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}renderCards();
</script></body></html>
